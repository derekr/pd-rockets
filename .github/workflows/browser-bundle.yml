name: Browser bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - if: startsWith(github.ref, 'refs/tags/')
        run: bun run scripts/validate-release-tag.ts "$GITHUB_REF_NAME"
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run bundle:browser
      - uses: actions/upload-artifact@v4
        with:
          name: pd-rockets-browser
          path: dist/pd-rockets-browser.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pd-rockets-browser
          path: dist
      - name: Publish tagged bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/pd-rockets-browser.tar.gz --generate-notes
